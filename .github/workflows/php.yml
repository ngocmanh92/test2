name: PHP checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: find app bin public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: HTTP checks
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/nhip-tin-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/smoke.py
          printf "ci-admin\nci-test-password-123\n" | php bin/create-admin.php
          python3 tests/admin.py
